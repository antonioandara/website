name: Check and publish GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize the entire release so an older build cannot publish after a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      # Elm fetches packages from GitHub on every cold cache; keep them around so
      # a transient 504 from github.com/elm/* does not break the release.
      - name: Cache Elm packages
        uses: actions/cache@v4
        with:
          path: ~/.elm
          key: elm-${{ runner.os }}-${{ hashFiles('elm.json', '*/elm.json', 'projects/lms/demo/elm.json') }}
          restore-keys: |
            elm-${{ runner.os }}-
      - name: Build public artifact
        shell: bash
        run: |
          # github.com/elm/* tarballs are served by codeload, which occasionally
          # returns 5xx under load. Back off and retry rather than failing red.
          delays=(20 45 90 180)
          for attempt in 1 2 3 4 5; do
            if npm run build:production; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then break; fi
            wait_for=${delays[$((attempt-1))]}
            echo "Build attempt ${attempt} failed; retrying in ${wait_for}s..." >&2
            sleep "$wait_for"
          done
          echo 'Build failed after 5 attempts' >&2
          exit 1
      - name: Test public artifact
        run: npm run test:production
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/configure-pages@v6
      - name: Upload verified public artifact
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
